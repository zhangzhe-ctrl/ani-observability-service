# Schema reference only. Do not apply empty TLS values.
# certificates.yaml asks the existing ani-ca ClusterIssuer to populate these
# Secret keys; private keys must remain in Kubernetes and task-private storage.
apiVersion: v1
kind: Secret
metadata:
  name: ani-observability-server-tls
  namespace: ani-system
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
  ca.crt: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: ani-observability-governance-client-tls
  namespace: ani-system
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
  ca.crt: ""
