syntax = "proto3";

package conf.v1;

option go_package = "github.com/zhangzhe-ctrl/ani-observability-service/internal/conf/v1;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Governance governance = 2;
  Monitoring monitoring = 3;
}

message Governance {
  string tls_cert_file = 1;
  string tls_key_file = 2;
  string client_ca_file = 3;
}

message Monitoring {
  google.protobuf.Duration prometheus_timeout = 1;
  uint32 max_concurrent_requests = 2;
  uint32 max_concurrent_requests_per_tenant = 3;
  repeated Datasource datasources = 4;
}

message Datasource {
  string cluster_id = 1;
  string address = 2;
  string bearer_token_file = 3;
  string tls_ca_file = 4;
  string tls_server_name = 5;
}

message Server {
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  message Admin {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }

  GRPC grpc = 1;
  Admin admin = 2;
  google.protobuf.Duration shutdown_timeout = 3;
}
